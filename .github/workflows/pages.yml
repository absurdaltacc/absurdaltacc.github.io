name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Set up Folio WASM toolchain
        run: |
          rustup toolchain install nightly-2026-06-30 --profile minimal --component rust-src
          rustup target add wasm32-unknown-unknown --toolchain nightly-2026-06-30
          sudo apt-get update
          sudo apt-get install --yes binaryen
          cargo install wasm-bindgen-cli --version 0.2.105 --locked
          cargo install wasm-snip --locked

      - name: Build proxy runtime artifacts
        run: bun run build-proxy

      - name: Build frontend
        run: bunx vite build --config vite.config.js

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4