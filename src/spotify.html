<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#080a0d" />
    <title>Absent Music</title>
    <style>
      :root { color-scheme: dark; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }
      * { box-sizing: border-box; }
      html, body { background: #080a0d; color: #edf2f7; height: 100%; margin: 0; }
      body { display: grid; grid-template-rows: 52px 1fr; }
      header { align-items: center; border-bottom: 1px solid #202b32; display: flex; gap: 16px; padding: 0 18px; }
      a { color: #edf2f7; text-decoration: none; }
      .back { color: #84919c; font-size: 12px; }
      .brand { letter-spacing: .16em; font-size: 12px; }
      main { display: grid; min-height: 0; }
      iframe { border: 0; height: 100%; width: 100%; }
      .fallback { align-items: center; color: #87939f; display: flex; flex-direction: column; gap: 14px; justify-content: center; padding: 24px; text-align: center; }
      .fallback a { border: 1px solid #33414b; border-radius: 6px; padding: 9px 12px; }
    </style>
  </head>
  <body>
    <header><a class="back" href="/">back</a><a class="brand" href="/">ABSENT / YUKI MUSIC</a></header>
    <main>
      <iframe title="YukiOS music app" src="https://cdn.jsdelivr.net/gh/Reeyuki/shittifylol@master/shittify21.html" allow="autoplay; fullscreen" referrerpolicy="no-referrer" onerror="this.replaceWith(document.querySelector('.fallback-template').content.cloneNode(true))"></iframe>
      <template class="fallback-template"><div class="fallback"><strong>Music app unavailable</strong><span>Open the YukiOS music source directly.</span><a href="https://github.com/Reeyuki/YukiOS" target="_blank" rel="noopener noreferrer">YukiOS source</a></div></template>
    </main>
  </body>
</html>
