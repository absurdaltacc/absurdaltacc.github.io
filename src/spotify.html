<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#090b0d" />
    <title>Absent Spotify</title>
    <style>
      :root { color-scheme: dark; font-family: Lexend, system-ui, sans-serif; }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; background: #090b0d; color: #edf2f7; }
      body { display: grid; grid-template-rows: 56px 1fr; }
      header { align-items: center; border-bottom: 1px solid #242b32; display: flex; gap: 16px; padding: 0 20px; }
      a { color: #edf2f7; text-decoration: none; }
      .brand { font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
      .back { color: #a2acb7; font-size: 13px; }
      main { display: grid; gap: 22px; margin: auto; max-width: 760px; padding: 32px 20px; width: 100%; }
      h1 { font-size: clamp(2rem, 5vw, 4rem); margin: 0; }
      p { color: #a2acb7; line-height: 1.6; margin: 0; }
      form { display: flex; gap: 10px; }
      input, button { border: 1px solid #303a41; border-radius: 8px; font: inherit; padding: 12px 14px; }
      input { background: #11171c; color: #edf2f7; flex: 1; }
      button { background: #edf2f7; color: #090b0d; cursor: pointer; font-weight: 700; }
      #results { display: grid; gap: 10px; }
      .result { align-items: center; background: #12171b; border: 1px solid #242b32; border-radius: 10px; display: flex; gap: 12px; padding: 10px; }
      .result img { border-radius: 6px; height: 52px; object-fit: cover; width: 52px; }
      .result a { color: #edf2f7; font-weight: 700; }
      .result small { color: #8a98a5; display: block; margin-top: 4px; }
    </style>
  </head>
  <body>
    <header><a class="back" href="/">back</a><a class="brand" href="/">Absent / Spotify</a></header>
    <main>
      <div>
        <h1>Spotify</h1>
        <p>Search tracks locally through the public music index, then open them in Spotify.</p>
      </div>
      <form id="search-form">
        <input id="query" type="search" placeholder="search an artist or track" autocomplete="off" />
        <button type="submit">Search</button>
      </form>
      <div id="results" aria-live="polite"></div>
    </main>
    <script>
      const form = document.getElementById("search-form");
      const query = document.getElementById("query");
      const results = document.getElementById("results");
      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const value = query.value.trim();
        if (!value) return;
        results.textContent = "searching...";
        try {
          const response = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(value)}&entity=song&limit=12`);
          const data = await response.json();
          results.replaceChildren();
          for (const track of data.results || []) {
            const result = document.createElement("article");
            result.className = "result";
            const image = document.createElement("img");
            image.src = track.artworkUrl100 || "";
            image.alt = "";
            const info = document.createElement("div");
            const link = document.createElement("a");
            link.href = `https://open.spotify.com/search/${encodeURIComponent(`${track.artistName} ${track.trackName}`)}`;
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.textContent = track.trackName || "untitled";
            const artist = document.createElement("small");
            artist.textContent = track.artistName || "unknown artist";
            info.append(link, artist);
            result.append(image, info);
            results.append(result);
          }
          if (!results.children.length) results.textContent = "no results";
        } catch {
          results.textContent = "music search is unavailable right now";
        }
      });
    </script>
  </body>
</html>
