<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Absent Arcade</title>
    <style>
      :root { color-scheme: dark; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }
      * { box-sizing: border-box; }
      body { background: #080a0d; color: #edf2f7; margin: 0; min-height: 100vh; padding: 24px; }
      main { margin: 0 auto; max-width: 980px; }
      header { align-items: center; display: flex; justify-content: space-between; margin-bottom: 30px; }
      a { color: #aeb9c2; text-decoration: none; }
      h1 { font-size: clamp(1.8rem, 4vw, 3rem); letter-spacing: .12em; margin: 0; text-transform: uppercase; }
      p { color: #74818d; font-size: 12px; }
      .grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); }
      .game { background: #10161a; border: 1px solid #253039; border-radius: 9px; color: #edf2f7; cursor: pointer; display: block; font: inherit; padding: 18px; text-align: left; transition: border-color 160ms ease, transform 160ms ease; }
      .game:hover { border-color: #edf2f7; transform: translateY(-2px); }
      .game strong { display: block; font-size: 13px; margin-bottom: 8px; }
      .game small { color: #74818d; font-size: 10px; }
    </style>
  </head>
  <body>
    <main>
      <header><div><h1>Arcade</h1><p>Cartel-inspired quick launch, served through stable jsDelivr game assets.</p></div><a href="/">back</a></header>
      <section class="grid" aria-label="games">
        <button class="game" data-url="https://quantil.jsdelivr.net/gh/s0n-1m-cr1n3/sc13nc3@latest/assets/html/main/fnf.html"><strong>Friday Night Funkin</strong><small>rhythm / direct launch</small></button>
        <button class="game" data-url="https://quantil.jsdelivr.net/gh/s0n-1m-cr1n3/sc13nc3@latest/assets/html/main/1v1.html"><strong>1v1.LOL</strong><small>action / direct launch</small></button>
        <button class="game" data-url="https://quantil.jsdelivr.net/gh/s0n-1m-cr1n3/sc13nc3@latest/assets/html/main/retrobowl.html"><strong>Retro Bowl</strong><small>sports / direct launch</small></button>
        <button class="game" data-url="https://quantil.jsdelivr.net/gh/s0n-1m-cr1n3/sc13nc3@latest/assets/html/main/spacewaves.html"><strong>Space Waves</strong><small>arcade / direct launch</small></button>
        <button class="game" data-url="https://quantil.jsdelivr.net/gh/s0n-1m-cr1n3/sc13nc3@latest/assets/html/main/gdweb.html"><strong>GDWEB+</strong><small>platform / direct launch</small></button>
      </section>
    </main>
    <script>
      document.querySelectorAll(".game").forEach((button) => button.addEventListener("click", () => { window.location.href = button.dataset.url; }));
    </script>
  </body>
</html>
